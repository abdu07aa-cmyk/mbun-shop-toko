<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="description" content="MBUN COLLECTION — Belanja online, ambil sendiri atau diantar">
<title>MBUN COLLECTION — Toko Online</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">🛍️</span>
      <div>
        <h1>MBUN COLLECTION</h1>
        <span>Belanja Online • Ambil Sendiri atau Diantar</span>
      </div>
    </div>
    <div class="topbar-actions">
      <button class="icon-btn" id="adminOrdersBtn" title="Kelola Pesanan">
        <i class="fa-solid fa-clipboard-list"></i>
        <span id="adminOrdersBadge" class="badge" hidden>0</span>
      </button>
      <button class="icon-btn" id="adminToggleBtn" title="Kelola Produk">
        <i class="fa-solid fa-boxes"></i>
      </button>
      <button class="icon-btn" id="ordersBtn" title="Pesanan Saya">
        <i class="fa-solid fa-receipt"></i>
        <span id="orderStatusBadge" class="badge" hidden>0</span>
      </button>
      <button class="icon-btn" id="cartBtn" title="Keranjang">
        <i class="fa-solid fa-cart-shopping"></i>
        <span id="cartBadge" class="badge" hidden>0</span>
      </button>
    </div>
  </header>

  <div id="promoContainer" class="promo-container"></div>

  <div class="toolbar">
    <div class="search-box">
      <i class="fa-solid fa-search"></i>
      <input type="text" id="searchInput" placeholder="Cari produk...">
    </div>
    <div class="category-pills" id="categoryPills"></div>
  </div>

  <main id="catalogView">
    <div class="product-grid" id="productGrid"></div>
    <div id="catalogEmpty" class="empty-state" hidden>
      <i class="fa-solid fa-box-open"></i>
      <p>Produk tidak ditemukan</p>
    </div>
  </main>

  <!-- CART -->
  <div class="drawer-overlay" id="cartOverlay"></div>
  <aside class="drawer" id="cartDrawer">
    <div class="drawer-header">
      <h2><i class="fa-solid fa-cart-shopping"></i> Keranjang</h2>
      <button class="icon-btn" id="closeCartBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="cartItems"></div>
    <div class="drawer-footer">
      <div class="summary-row summary-total">
        <span>Total</span>
        <span id="cartTotal">Rp 0</span>
      </div>
      <button class="btn btn-primary btn-block" id="checkoutBtn">Checkout</button>
    </div>
  </aside>

  <!-- CHECKOUT -->
  <div class="drawer-overlay" id="checkoutOverlay"></div>
  <aside class="drawer" id="checkoutDrawer">
    <div class="drawer-header">
      <h2><i class="fa-solid fa-clipboard-list"></i> Checkout</h2>
      <button class="icon-btn" id="closeCheckoutBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="checkoutBody"></div>
  </aside>

  <!-- ORDERS -->
  <div class="drawer-overlay" id="ordersOverlay"></div>
  <aside class="drawer" id="ordersDrawer">
    <div class="drawer-header">
      <h2><i class="fa-solid fa-receipt"></i> Pesanan Saya</h2>
      <button class="icon-btn" id="closeOrdersBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="ordersBody"></div>
  </aside>

  <!-- ADMIN PRODUK -->
  <div class="drawer-overlay" id="adminOverlay"></div>
  <aside class="drawer" id="adminPanel">
    <div class="drawer-header">
      <h2><i class="fa-solid fa-boxes"></i> Kelola Produk</h2>
      <button class="icon-btn" id="closeAdminBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="adminProductList">
      <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat data...</p></div>
    </div>
  </aside>

  <!-- ADMIN PESANAN -->
  <div class="drawer-overlay" id="adminOrdersOverlay"></div>
  <aside class="drawer drawer-wide" id="adminOrdersDrawer">
    <div class="drawer-header">
      <h2><i class="fa-solid fa-clipboard-list"></i> Kelola Pesanan</h2>
      <button class="icon-btn" id="closeAdminOrdersBtn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-body" id="adminOrdersContent">
      <div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Memuat pesanan...</p></div>
    </div>
  </aside>

  <div class="toast-container" id="toastContainer"></div>
  <div class="loading-overlay" id="loadingOverlay" hidden>
    <div class="spinner"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
